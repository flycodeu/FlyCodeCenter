<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 测温工作台</title>
<style>body{margin:0;background:#f3f5f1;color:#182c26;font:15px/1.7 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:400px;margin:12vh auto;padding:32px;background:#fff;border:1px solid #dce4de;border-radius:8px}small{color:#205d47;letter-spacing:2px}h1{font-size:25px}p{color:#68786f}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #cbd7ce;border-radius:4px;margin:8px 0}button{background:#205d47;color:white;cursor:pointer}#error{color:#a23b2c}label{display:block}@media(max-width:480px){main{margin:10vh 16px;padding:24px}}</style>
<main><small>HIKVISION / THERMAL</small><h1>进入测温工作台</h1><p>使用服务器启动时配置的管理口令。海康回调无需登录。</p><form id="login"><label for="password">管理口令</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">登录</button></form><p id="error" role="status"></p><p>此口令与海康 AppSecret 不同。</p></main>
<script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('submit');button.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.getElementById('password').value})});const data=await r.json();if(!r.ok)throw Error(data.error||'登录失败');document.getElementById('password').value='';location.reload();}catch(error){document.getElementById('error').textContent=error.message;}finally{button.disabled=false;}};</script></html>
