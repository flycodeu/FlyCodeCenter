<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Medication Tracker Blueprint">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1d1a"/>
      <stop offset="50%" stop-color="#0a1614"/>
      <stop offset="100%" stop-color="#050d0b"/>
    </linearGradient>
    <radialGradient id="mradial" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#132c25" stroke-width="1" opacity="0.65"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#mbg)"/>
  <rect width="1200" height="675" fill="url(#mradial)"/>
  <rect width="1200" height="675" fill="url(#mgrid)"/>
  
  <!-- Editor Window Container -->
  <rect x="90" y="70" width="1020" height="535" rx="14" fill="#07120f" stroke="#14362d" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <circle cx="130" cy="112" r="7" fill="#ef4444" opacity="0.85"/>
  <circle cx="155" cy="112" r="7" fill="#f59e0b" opacity="0.85"/>
  <circle cx="180" cy="112" r="7" fill="#10b981" opacity="0.85"/>
  <text x="220" y="118" fill="#5c8a7c" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16">services / medication-schedule.ts</text>
  <line x1="90" y1="145" x2="1110" y2="145" stroke="#14362d" stroke-width="1"/>
  
  <!-- Code Lines -->
  <text x="140" y="215" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="23">const</text>
  <text x="215" y="215" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="23">tracker = new MedicationScheduleService({</text>
  <text x="180" y="265" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">timetable: <tspan fill="#34d399">"Personalized Intake Presets &amp; Dosage"</tspan>,</text>
  <text x="180" y="310" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">reminders: <tspan fill="#34d399">"Multi-Device High-Priority Push Alerts"</tspan>,</text>
  <text x="180" y="355" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">collaboration: <tspan fill="#34d399">"Family Sync &amp; Shared Caretaker Channel"</tspan>,</text>
  <text x="180" y="400" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">audit: <tspan fill="#34d399">"Compliance Log &amp; Medical History Export"</tspan></text>
  <text x="140" y="450" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="23">});</text>
  
  <!-- Status Chip -->
  <rect x="140" y="500" width="220" height="42" rx="8" fill="#0d2821" stroke="#10b981" stroke-width="1"/>
  <circle cx="165" cy="521" r="5" fill="#34d399"/>
  <text x="260" y="527" fill="#34d399" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="600" text-anchor="middle">健康计划工具 · 研发中</text>
</svg>
