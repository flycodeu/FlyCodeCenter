<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Video AI Monitor Blueprint">
  <defs>
    <linearGradient id="vbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>
    <radialGradient id="vradial" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="vgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.65"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#vbg)"/>
  <rect width="1200" height="675" fill="url(#vradial)"/>
  <rect width="1200" height="675" fill="url(#vgrid)"/>
  
  <!-- Editor Window Container -->
  <rect x="90" y="70" width="1020" height="535" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <circle cx="130" cy="112" r="7" fill="#ef4444" opacity="0.85"/>
  <circle cx="155" cy="112" r="7" fill="#f59e0b" opacity="0.85"/>
  <circle cx="180" cy="112" r="7" fill="#10b981" opacity="0.85"/>
  <text x="220" y="118" fill="#64748b" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16">pipeline / stream-analytics.ts</text>
  <line x1="90" y1="145" x2="1110" y2="145" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Code Lines -->
  <text x="140" y="215" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="23">const</text>
  <text x="215" y="215" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="23">monitor = new StreamAnalyticsService({</text>
  <text x="180" y="265" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">ingestion: <tspan fill="#38bdf8">"RTSP / MediaMTX High-Throughput"</tspan>,</text>
  <text x="180" y="310" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">inference: <tspan fill="#38bdf8">"YOLOv8 + TensorRT Accelerated"</tspan>,</text>
  <text x="180" y="355" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">orchestration: <tspan fill="#38bdf8">"Multi-Camera Dynamic Scheduling"</tspan>,</text>
  <text x="180" y="400" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">dispatch: <tspan fill="#38bdf8">"EventBus -&gt; Feishu Webhook Alert"</tspan></text>
  <text x="140" y="450" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="23">});</text>
  
  <!-- Status Chip -->
  <rect x="140" y="500" width="220" height="42" rx="8" fill="#0c2340" stroke="#0284c7" stroke-width="1"/>
  <circle cx="165" cy="521" r="5" fill="#38bdf8"/>
  <text x="260" y="527" fill="#38bdf8" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="600" text-anchor="middle">智能推理监控 · 研发中</text>
</svg>
