  <circle cx="155" cy="112" r="7" fill="#f59e0b" opacity="0.85"/>
  <circle cx="180" cy="112" r="7" fill="#10b981" opacity="0.85"/>
  <text x="220" y="118" fill="#587691" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16">modules / developer-toolbox.ts</text>
  <line x1="90" y1="145" x2="1110" y2="145" stroke="#162b3d" stroke-width="1"/>
  
  <!-- Code Lines -->
  <text x="140" y="215" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="23">const</text>
