<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tools Platform Blueprint">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="50%" stop-color="#0a121a"/>
      <stop offset="100%" stop-color="#050a0f"/>
    </linearGradient>
    <radialGradient id="tradial" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#162736" stroke-width="1" opacity="0.65"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#tbg)"/>
  <rect width="1200" height="675" fill="url(#tradial)"/>
  <rect width="1200" height="675" fill="url(#tgrid)"/>
  
  <!-- Editor Window Container -->
  <rect x="90" y="70" width="1020" height="535" rx="14" fill="#080e15" stroke="#162b3d" stroke-width="1.5"/>
  
