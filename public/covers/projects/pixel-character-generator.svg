<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pixel Character Generator Blueprint">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241410"/>
      <stop offset="50%" stop-color="#190e0b"/>
      <stop offset="100%" stop-color="#0c0604"/>
    </linearGradient>
    <radialGradient id="pradial" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3d211a" stroke-width="1" opacity="0.65"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#pbg)"/>
  <rect width="1200" height="675" fill="url(#pradial)"/>
  <rect width="1200" height="675" fill="url(#pgrid)"/>
  
  <!-- Editor Window Container -->
  <rect x="90" y="70" width="1020" height="535" rx="14" fill="#130b08" stroke="#421f17" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <circle cx="130" cy="112" r="7" fill="#ef4444" opacity="0.85"/>
  <circle cx="155" cy="112" r="7" fill="#f59e0b" opacity="0.85"/>
  <circle cx="180" cy="112" r="7" fill="#10b981" opacity="0.85"/>
  <text x="220" y="118" fill="#8c6a61" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16">generator / sprite-sheet-pipeline.ts</text>
  <line x1="90" y1="145" x2="1110" y2="145" stroke="#421f17" stroke-width="1"/>
  
  <!-- Code Lines -->
  <text x="140" y="215" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="23">const</text>
  <text x="215" y="215" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="23">generator = new PixelSpriteEngine({</text>
  <text x="180" y="265" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">grid: <tspan fill="#fb923c">"16x16 / 32x32 Retro Pixel Canvas"</tspan>,</text>
  <text x="180" y="310" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">layers: <tspan fill="#fb923c">"Skeleton | Armor | Weapon | VFX Overlays"</tspan>,</text>
  <text x="180" y="355" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">animation: <tspan fill="#fb923c">"Idle -&gt; Run -&gt; Attack (8-Frame Sequence)"</tspan>,</text>
  <text x="180" y="400" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">export: <tspan fill="#fb923c">"SpriteSheet PNG + Aseprite JSON Atlas"</tspan></text>
  <text x="140" y="450" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="23">});</text>
  
  <!-- Status Chip -->
  <rect x="140" y="500" width="220" height="42" rx="8" fill="#31150e" stroke="#f97316" stroke-width="1"/>
  <circle cx="165" cy="521" r="5" fill="#fb923c"/>
  <text x="260" y="527" fill="#fb923c" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="600" text-anchor="middle">像素艺术工具 · 研发中</text>
</svg>
