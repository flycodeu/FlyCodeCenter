<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wuxia Roguelite Game Blueprint">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#220e14"/>
      <stop offset="50%" stop-color="#18090e"/>
      <stop offset="100%" stop-color="#0a0305"/>
    </linearGradient>
    <radialGradient id="wradial" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <pattern id="wgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b1622" stroke-width="1" opacity="0.65"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#wbg)"/>
  <rect width="1200" height="675" fill="url(#wradial)"/>
  <rect width="1200" height="675" fill="url(#wgrid)"/>
  
  <!-- Editor Window Container -->
  <rect x="90" y="70" width="1020" height="535" rx="14" fill="#12070b" stroke="#441724" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <circle cx="130" cy="112" r="7" fill="#ef4444" opacity="0.85"/>
  <circle cx="155" cy="112" r="7" fill="#f59e0b" opacity="0.85"/>
  <circle cx="180" cy="112" r="7" fill="#10b981" opacity="0.85"/>
  <text x="220" y="118" fill="#8c5867" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16">game / sect-management-state.gd</text>
  <line x1="90" y1="145" x2="1110" y2="145" stroke="#441724" stroke-width="1"/>
  
  <!-- Code Lines -->
  <text x="140" y="215" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="23">class_name</text>
  <text x="290" y="215" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="23">WuxiaRogueliteSystem extends Node</text>
  <text x="180" y="265" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">var engine = <tspan fill="#f43f5e">Godot4TurnBasedScheduleEngine.new()</tspan></text>
  <text x="180" y="310" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">var world = <tspan fill="#f43f5e">ProceduralJianghuMap.generate(seed)</tspan></text>
  <text x="180" y="355" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">var sect = <tspan fill="#f43f5e">SectManagementState.init("Disciples &amp; KungFu")</tspan></text>
  <text x="180" y="400" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">func execute_turn() -&gt; <tspan fill="#fbbf24">RogueliteEventOutcome</tspan>:</text>
  <text x="220" y="445" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">return engine.resolve_events(world, sect)</text>
  
  <!-- Status Chip -->
  <rect x="140" y="500" width="220" height="42" rx="8" fill="#310f19" stroke="#e11d48" stroke-width="1"/>
  <circle cx="165" cy="521" r="5" fill="#f43f5e"/>
  <text x="260" y="527" fill="#f43f5e" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="600" text-anchor="middle">独立游戏构筑 · 研发中</text>
</svg>
