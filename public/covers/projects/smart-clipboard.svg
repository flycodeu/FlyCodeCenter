<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Smart Clipboard Blueprint">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181326"/>
      <stop offset="50%" stop-color="#120e1e"/>
      <stop offset="100%" stop-color="#090611"/>
    </linearGradient>
    <radialGradient id="cradial" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#271c3d" stroke-width="1" opacity="0.65"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#cbg)"/>
  <rect width="1200" height="675" fill="url(#cradial)"/>
  <rect width="1200" height="675" fill="url(#cgrid)"/>
  
  <!-- Editor Window Container -->
  <rect x="90" y="70" width="1020" height="535" rx="14" fill="#0e0a17" stroke="#2e1f4d" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <circle cx="130" cy="112" r="7" fill="#ef4444" opacity="0.85"/>
  <circle cx="155" cy="112" r="7" fill="#f59e0b" opacity="0.85"/>
  <circle cx="180" cy="112" r="7" fill="#10b981" opacity="0.85"/>
  <text x="220" y="118" fill="#7e6d99" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="16">core / clipboard-sync-engine.ts</text>
  <line x1="90" y1="145" x2="1110" y2="145" stroke="#2e1f4d" stroke-width="1"/>
  
  <!-- Code Lines -->
  <text x="140" y="215" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="23">const</text>
  <text x="215" y="215" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="23">clipboard = new SmartClipboardSync({</text>
  <text x="180" y="265" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">protocol: <tspan fill="#c084fc">"P2P / Local-First LAN Transport"</tspan>,</text>
  <text x="180" y="310" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">storage: <tspan fill="#c084fc">"SQLite3 + FTS5 Full-Text Indexing"</tspan>,</text>
  <text x="180" y="355" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">classifier: <tspan fill="#c084fc">"TypeDetector: Text | Code | Image | URL"</tspan>,</text>
  <text x="180" y="400" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="19">encryption: <tspan fill="#c084fc">"AES-256-GCM End-to-End Vault"</tspan></text>
  <text x="140" y="450" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="23">});</text>
  
  <!-- Status Chip -->
  <rect x="140" y="500" width="220" height="42" rx="8" fill="#24133b" stroke="#a855f7" stroke-width="1"/>
  <circle cx="165" cy="521" r="5" fill="#c084fc"/>
  <text x="260" y="527" fill="#c084fc" font-family="'Noto Sans SC', sans-serif" font-size="15" font-weight="600" text-anchor="middle">多端协同工具 · 研发中</text>
</svg>
